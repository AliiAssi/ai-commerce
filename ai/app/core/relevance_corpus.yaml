version: 1

cases:

  - id: en-frying-oil-under-25
    query: olive oil for frying under $25
    language: en
    source: spec
    section: "15.1"
    expect_filters: {max_price: "25"}
    first: Everyday Cooking Olive Oil
    excluded: [Baladi Extra Virgin Olive Oil, Koura Valley First Press]
    note: >-
      The finishing and first-press oils are both over $25, so they must be filtered out rather
      than merely outranked. This is also why the parser keeps "olive oil" in the semantic text:
      stripping it would leave the ranker with "for frying".

  - id: en-coffee-ritual
    query: something for a Lebanese coffee ritual
    language: en
    source: spec
    section: "15.1"
    required: [Lebanese Coffee with Cardamom, Copper Coffee Set]
    top_k: 5
    note: >-
      Must NOT resolve a category filter. The Copper Coffee Set lives in Glass & Copper, so a
      coffee category filter would exclude the product this case requires — the reason `coffee`
      is a weak alias.

  - id: en-mezze-bowls
    query: green bowls for a mezze table
    language: en
    source: spec
    section: "15.1"
    first: Olive-Glaze Mezze Bowls, set of six

  - id: en-tripoli-soap
    query: traditional soap from Tripoli
    language: en
    source: spec
    section: "15.1"
    expect_filters: {origin_key: tripoli}
    required: [Tripoli Olive Oil Soap, "Laurel and Olive Soap, aged nine months"]
    top_k: 5
    note: >-
      The catalog spells this origin two ways — "Tripoli" and "Tripoli, North Lebanon" — so the
      place hierarchy has to resolve both or one of the two soaps disappears.

  - id: en-housewarming-bcharre
    query: housewarming gift under $30 from Bcharre
    language: en
    source: spec
    section: "15.1"
    expect_filters: {max_price: "30", origin_key: bcharre}
    required:
      - "Cedar Coasters, set of six"
      - Mountain Wildflower Honey
      - Beeswax and Olive Candle
    top_k: 5

  - id: en-fattoush-in-stock
    query: available sour ingredient for fattoush
    language: en
    source: spec
    section: "15.1"
    expect_filters: {in_stock_only: true}
    first: Pomegranate Molasses
    excluded: [Single-Origin Sumac]
    note: Sumac is the better semantic match and is sold out; availability must beat relevance.

  - id: en-glass-south-lebanon
    query: handmade recycled glass drinkware from south Lebanon
    language: en
    source: spec
    section: "15.1"
    expect_filters: {origin_key: south-lebanon}
    required: ["Sarafand Hand-Blown Tumblers, set of four", Recycled Glass Pitcher]
    top_k: 5

  - id: en-table-linens-under-30
    query: table linens under $30
    language: en
    source: spec
    section: "15.1"
    expect_filters: {max_price: "30"}
    required: ["Linen Napkins, set of four"]
    top_k: 5

  - id: en-nonsense
    query: zzzznotathing
    language: en
    source: spec
    section: "15.1"
    allow_empty: true
    note: >-
      §7.4's relevance floor. No filter is expressed, so the constraint fallback must not fire and
      the correct answer is nothing at all rather than the nearest neighbours.

  - id: en-exact-name
    query: Baladi Extra Virgin Olive Oil
    language: en
    source: spec
    section: "15.1"
    exact_name: true
    first: Baladi Extra Virgin Olive Oil

  - id: ar-frying-oil-under-25
    query: زيت زيتون للطبخ والقلي تحت ٢٥ دولار
    language: ar
    source: spec
    section: "15.2"
    expect_filters: {max_price: "25"}
    first: Everyday Cooking Olive Oil
    note: Arabic-Indic digits must normalize before the price phrase can be read at all.

  - id: ar-coffee-set
    query: عدة كاملة لتحضير القهوة اللبنانية
    language: ar
    source: spec
    section: "15.2"
    required: [Copper Coffee Set, Lebanese Coffee with Cardamom]
    top_k: 5

  - id: ar-mezze-bowls
    query: أوعية خضراء للمقبلات
    language: ar
    source: spec
    section: "15.2"
    first: Olive-Glaze Mezze Bowls, set of six

  - id: ar-tripoli-soap
    query: صابون تقليدي من طرابلس
    language: ar
    source: spec
    section: "15.2"
    expect_filters: {origin_key: tripoli}
    required: [Tripoli Olive Oil Soap, "Laurel and Olive Soap, aged nine months"]
    top_k: 5
    note: >-
      No Arabic token can match an English catalog lexically (§2.1), so before embeddings this
      case is answered entirely by the origin filter and the constraint fallback.

  - id: ar-home-gift-under-30
    query: هدية للبيت مصنوعة يدوياً بأقل من ٣٠ دولار
    language: ar
    source: spec
    section: "15.2"
    expect_filters: {max_price: "30"}
    note: §15.2 states this as SHOULD, so it asserts the filter and leaves ranking to the gates.

  - id: ar-bekaa-in-stock-under-15
    query: منتجات متوفرة من البقاع بأقل من ١٥ دولار
    language: ar
    source: spec
    section: "15.2"
    expect_filters: {max_price: "15", in_stock_only: true, origin_key: bekaa}
    excluded: [Single-Origin Sumac]
    note: >-
      Sumac is from Hermel, which the lexicon groups under Bekaa, and is sold out — so it is
      excluded by availability rather than by origin. That distinction is the case.

  - id: ar-sour-for-fattoush
    query: شيء حامض للفتوش
    language: ar
    source: spec
    section: "15.2"
    required: [Pomegranate Molasses]
    top_k: 2
    note: No availability was requested, so sumac may legitimately appear alongside it.

  - id: ar-recycled-glass-tumblers
    query: طقم كاسات زجاج معاد تدويره
    language: ar
    source: spec
    section: "15.2"
    first: Sarafand Hand-Blown Tumblers, set of four

  - id: mixed-coffee-beirut-under-20
    query: coffee من Beirut under 20
    language: mixed
    source: spec
    section: "15.3"
    expect_filters: {max_price: "20", origin_key: beirut, category_slug: coffee-sweets}
    excluded: ["Walnut Maamoul, box of twelve"]
    note: >-
      `coffee` filters here but not in en-coffee-ritual. A short filter-like query applies a weak
      alias; a descriptive sentence does not. Maamoul is Beirut and $22, so it fails the price
      bound rather than the category one.

  - id: mixed-explicit-category-wins
    query: soap under 20
    language: en
    source: spec
    section: "15.3"
    explicit: {category_slug: ceramics}
    expect_filters: {category_slug: ceramics, max_price: "20"}
    expect_inferred: {category: Soap & Skincare}
    excluded: [Tripoli Olive Oil Soap]
    note: >-
      The inferred soap category must be REPORTED and NOT APPLIED. Reporting it is what lets the
      shopper see why the results look nothing like the words they typed.

  - id: mixed-contradictory-range
    query: under $20
    language: en
    source: spec
    section: "15.3"
    explicit: {min_price: "25"}
    expect_error: validation
    note: >-
      §9.3: an invalid query is rejected, never answered with results that ignore half of it.
      This is the one case where falling back to lexical search would be the wrong behaviour.

  - id: mixed-arabic-with-explicit-sort
    query: صابون من طرابلس
    language: ar
    source: spec
    section: "15.3"
    sort: price_asc
    expect_filters: {origin_key: tripoli, sort: price_asc}
    first: Tripoli Olive Oil Soap
    note: >-
      Arabic retrieval determines membership; price determines ordering (§7.5). The Tripoli soap
      is $9 and the laurel soap $14, so price_asc fixes the first result deterministically.

  - id: en-copper-not-sold-out-first
    query: copper
    language: en
    source: draft
    excluded: []
    note: >-
      Hard negative on §7.4 rule 5. The Hammered Copper Rakwe is sold out; with relevance
      otherwise equivalent it must not lead. Asserted as "not first" rather than naming a winner,
      because which of the two in-stock copper pieces leads is not something §15 fixes.
    not_first: [Hammered Copper Rakwe]

  - id: en-cedar-from-bcharre
    query: cedar
    language: en
    source: draft
    required: ["Cedar Coasters, set of six", Cedar Keepsake Box, Cedarwood Serving Board]
    top_k: 5
    note: Three products carry "Cedar" in the name; all should surface before anything else.

  - id: en-transliteration-rakweh
    query: rakweh
    language: en
    source: draft
    required: [Hammered Copper Rakwe]
    top_k: 3
    note: >-
      Trigram-only recall. The catalog spells it "Rakwe"; full-text search misses this entirely,
      which is the whole reason §7.2 added the trigram leg.

  - id: en-transliteration-zatar
    query: zatar
    language: en
    source: draft
    required: ["Wild Mountain Za'atar"]
    top_k: 5
    note: Apostrophe unification plus trigram similarity against "Za'atar".

  - id: en-transliteration-frikeh
    query: frikeh
    language: en
    source: draft
    required: [Smoked Freekeh]
    top_k: 3

  - id: en-category-word-only
    query: tableware
    language: en
    source: draft
    required: [Stoneware Dinner Plate, Hand-Thrown Serving Bowl]
    top_k: 6
    note: >-
      Phase 4's gain, as a case. "Tableware" appears only in the category name "Ceramics &
      Tableware" — never in a product name or description — so this is unanswerable from web's
      products.search_vector and only works on §12's step 3.

  - id: en-hard-negative-oil-is-not-olives
    query: olive wood board
    language: en
    source: draft
    first: Olive Wood Chopping Board
    note: >-
      Hard negative. "Olive" matches nine food products; the woodwork item has to win on the
      other two words. This is the case the setweight A-label on the product name exists for.

  - id: en-out-of-budget-is-empty-not-nearest
    query: copper coffee set under $20
    language: en
    source: draft
    expect_filters: {max_price: "20"}
    excluded: [Copper Coffee Set, Hammered Copper Rakwe, Copper Serving Tray]
    note: >-
      The requested product exists and costs $76. A price bound is not a preference — returning
      it anyway, or returning unrelated cheap goods as "close", are both failures.

