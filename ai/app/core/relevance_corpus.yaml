  - id: ar-not-in-catalog
    query: ماكينة قهوة كهربائية
    language: ar
    source: spec
    section: "15"
    excluded: [Copper Coffee Set, Hammered Copper Rakwe]
    note: >-
      There are no appliances. Returning the copper set because it is coffee-shaped is the
      nearest-neighbour failure the relevance floor exists to prevent — in Arabic this time.

      PROMOTED to spec in phase 6 alongside en-not-in-catalog; the reasoning is written out
      there. This one matters more, not less: Arabic has no lexical leg against an English
      catalog, so an Arabic query's candidates come from the semantic leg alone and there is no
      second opinion to keep an unrelated neighbour out.

  - id: mixed-soap-min-price
    query: soap من طرابلس over $10
    language: mixed
    source: draft
    expect_filters: {origin_key: tripoli, min_price: "10"}
    excluded: [Tripoli Olive Oil Soap]
    note: The $9 soap fails the minimum; only the $14 laurel soap survives.

  - id: mixed-arabic-noun-english-filter
    query: زعتر under $15
    language: mixed
    source: draft
    expect_filters: {max_price: "15"}
    required: ["Wild Mountain Za'atar"]
    top_k: 4
    note: Arabic product word, English price phrase — the reverse of mixed-coffee-beirut-under-20.

  - id: mixed-english-noun-arabic-filter
    query: honey من بشري
