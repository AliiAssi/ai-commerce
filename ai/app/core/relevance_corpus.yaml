  # ---- Generated Arabic and mixed, batch 2 ---------------------------------------------------
  #
  # ALL DRAFT, and this is the half SMART_SEARCH_PLAN.md flags as needing the owner specifically.
  # Every case below was generated, not judged. Two things to check when reviewing:
  #
  #   1. Is the Arabic a natural way for a Lebanese shopper to ask for this? Not merely
  #      grammatical — natural. A stilted query tests a shopper who does not exist.
  #   2. Is the expected product the right answer, or merely *an* answer? Where a second product
  #      would satisfy the query equally well, the case should require both or neither.
  #
  # Cases marked `# MODEL AGREES` were checked against gemini-embedding-001 and it ranked the
  # expected product first. That is evidence the query expresses the intent, not proof the
  # phrasing is idiomatic — only a native reading settles that.

  # deterministic filters, which work today and do not depend on a model
  - id: ar-price-under-twenty
    query: أقل من عشرين دولار
    language: ar
    source: draft
    expect_filters: {max_price: "20"}
    note: Price written as a word rather than a numeral. Confirm the parser is meant to catch it.

