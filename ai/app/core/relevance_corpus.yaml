  - id: mixed-latin-transliteration
    query: zaatar from Bekaa
    language: en
    source: draft
    expect_filters: {origin_key: bekaa}
    required: ["Wild Mountain Za'atar"]
    top_k: 4
    note: >-
      Latin script throughout but the noun is a transliteration, so this is tagged `en` — the
      language field records the script the shopper typed, not the word's origin.
