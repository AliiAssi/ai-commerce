    language: en
    source: draft
    required: [Smoked Freekeh]
    top_k: 3

  - id: en-category-word-only
    query: tableware
    language: en
    source: draft
    required: [Stoneware Dinner Plate, Hand-Thrown Serving Bowl]
    top_k: 6
    note: >-
      Phase 4's gain, as a case. "Tableware" appears only in the category name "Ceramics &
      Tableware" — never in a product name or description — so this is unanswerable from web's
      products.search_vector and only works on §12's step 3.

  - id: en-hard-negative-oil-is-not-olives
    query: olive wood board
    language: en
    source: draft
    first: Olive Wood Chopping Board
    note: >-
      Hard negative. "Olive" matches nine food products; the woodwork item has to win on the
      other two words. This is the case the setweight A-label on the product name exists for.

  - id: en-out-of-budget-is-empty-not-nearest
    query: copper coffee set under $20
    language: en
    source: draft
    expect_filters: {max_price: "20"}
    excluded: [Copper Coffee Set, Hammered Copper Rakwe, Copper Serving Tray]
    note: >-
      The requested product exists and costs $76. A price bound is not a preference — returning
      it anyway, or returning unrelated cheap goods as "close", are both failures.

  - id: ar-cedar-wood
    query: خشب الأرز
    language: ar
    source: draft
    required: [Cedar Keepsake Box, Cedarwood Serving Board]
    top_k: 5
    note: DRAFT — needs a native reading. Expected to fail before embeddings exist (§2.1).

  - id: ar-honey
    query: عسل جبلي
    language: ar
    source: draft
    required: [Mountain Wildflower Honey]
    top_k: 5
    note: DRAFT — needs a native reading. Expected to fail before embeddings exist.

  - id: ar-soap-no-origin
    query: صابون بزيت الزيتون
    language: ar
    source: draft
    required: [Tripoli Olive Oil Soap]
    top_k: 5
    note: >-
      DRAFT — needs a native reading. Deliberately carries no place name, so unlike
      ar-tripoli-soap there is no filter to fall back on. This is the case that measures whether
      embeddings actually bought cross-lingual retrieval.

  - id: ar-cushions
    query: وسادات قماش
    language: ar
    source: draft
    required: [Kilim Cushion Cover, Striped Cotton Cushion]
    top_k: 5
    note: DRAFT — needs a native reading.

  - id: ar-price-only
    query: أقل من ١٥ دولار
    language: ar
    source: draft
    expect_filters: {max_price: "15"}
    note: >-
      DRAFT. Filters-only: nothing is left after the price phrase, so §7.2 skips retrieval and
      this must be a filtered browse rather than a text search that found nothing.

  # ---- Generated English, batch 2 — §15's expansion toward 50 judged queries -----------------
  #
  # All DRAFT. Grounded in catalog facts (prices, stock, origins, category names) so most should
  # be quick to confirm or reject. Grouped by what each one is actually testing, because a corpus
