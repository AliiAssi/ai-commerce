# Origins.
#
# `origins` lists the literal strings stored in products.origin. The catalog spells the same
# town two ways — "Tripoli" and "Tripoli, North Lebanon" — which is exactly the hierarchy §6
# calls out, and is why a place owns a list rather than a single value. Startup validation
# fails if any string here is absent from the catalog, or if any catalog origin is unclaimed.
#
# `children` builds the region hierarchy: a region has no origins of its own and resolves to the
# union of its members, so "North Lebanon" reaches Koura, Zgharta, Bcharre, Tripoli and Akkar.
places:
  # ---- localities -------------------------------------------------------------------------
  akkar:
    label: Akkar
    origins: ["Akkar"]
    strong:
      en: [akkar]
      ar: [عكار]

  baalbek:
    label: Baalbek
    origins: ["Baalbek"]
    strong:
      en: [baalbek, baalbeck, baalbec]
      ar: [بعلبك]

  bcharre:
    label: Bcharre
    origins: ["Bcharre, North Lebanon"]
    strong:
      en: [bcharre, bcharreh, bsharri, becharre, bsharre]
      ar: [بشري, بشرة, بشرّي]

  beirut:
    label: Beirut
    origins: ["Beirut"]
    strong:
      en: [beirut, beyrouth]
      ar: [بيروت]

  beit-chabab:
    label: Beit Chabab
    origins: ["Beit Chabab"]
    strong:
      en: [beit chabab, beit chebab, bayt shabab]
      ar: [بيت شباب]

  # No aliases of its own: "Bekaa Valley" as a phrase resolves to the region below, which
  # already contains this origin. Declared so the origin string has an owner.
  bekaa-valley:
    label: Bekaa Valley
    origins: ["Bekaa Valley"]

  chouf:
    label: Chouf
    origins: ["Chouf"]
    children: [deir-el-qamar]
    strong:
      en: [chouf, shouf, el chouf]
      ar: [الشوف]
    weak:
      # Bare شوف is the Levantine imperative "look" as often as it is the district.
      ar: [شوف]

  deir-el-qamar:
    label: Deir el Qamar
    origins: ["Deir el Qamar"]
    strong:
      en: [deir el qamar, deir al qamar, deir el kamar, deir qamar]
      ar: [دير القمر]

  hasbaya:
    label: Hasbaya
    origins: ["Hasbaya, South Lebanon"]
    strong:
      en: [hasbaya, hasbaiya, hasbaya el chouf]
      ar: [حاصبيا]

  hermel:
    label: Hermel
    origins: ["Hermel"]
    strong:
      en: [hermel, el hermel]
      ar: [الهرمل, هرمل]

  jabal-moussa:
    label: Jabal Moussa
    origins: ["Jabal Moussa"]
    strong:
      en: [jabal moussa, jabal musa, jebel moussa]
      ar: [جبل موسى]

  jezzine:
    label: Jezzine
    origins: ["Jezzine, South Lebanon"]
    strong:
      en: [jezzine, jezzin, jizzine]
      ar: [جزين]

  koura:
    label: Koura
    origins: ["Koura, North Lebanon"]
    strong:
      en: [koura, el koura, al koura]
      ar: [الكورة, كورة]

  rachaya:
    label: Rachaya
    origins: ["Rachaya"]
    strong:
      en: [rachaya, rashaya, rachaya el wadi]
      ar: [راشيا]

  sarafand:
    label: Sarafand
    origins: ["Sarafand, South Lebanon"]
    strong:
      en: [sarafand, sarepta, es sarafand]
      ar: [الصرفند, صرفند]

  tripoli:
    label: Tripoli
    # Both spellings live in the catalog; §6 requires "Tripoli" to reach both.
    origins: ["Tripoli", "Tripoli, North Lebanon"]
    strong:
      en: [tripoli, trablous]
      ar: [طرابلس]

  tyre:
    label: Tyre
    origins: ["Tyre, South Lebanon"]
    strong:
      en: [tyre]
      ar: [صور لبنان]
    weak:
      # "Sour" is the usual transliteration of the town, and also the flavour word that carries
      # `available sour ingredient for fattoush` in §15.1. صور is likewise the plural of
      # "picture". All three only filter when the query is short enough to be a place lookup.
      en: [sour, sur]
      ar: [صور]

  zgharta:
    label: Zgharta
    origins: ["Zgharta, North Lebanon"]
    strong:
      en: [zgharta, zghorta]
      ar: [زغرتا]

  zouk-mikael:
    label: Zouk Mikael
    origins: ["Zouk Mikael"]
    strong:
      en: [zouk mikael, zouk mikayel, zouk mosbeh, zouk]
      ar: [ذوق مكايل, زوق مكايل, الذوق]

  # ---- regions ----------------------------------------------------------------------------
  north-lebanon:
    label: North Lebanon
    children: [tripoli, koura, zgharta, bcharre, akkar]
    strong:
      en: [north lebanon, northern lebanon, north of lebanon, the north]
      ar: [شمال لبنان, الشمال]

  south-lebanon:
    label: South Lebanon
    children: [sarafand, tyre, jezzine, hasbaya]
    strong:
      en: [south lebanon, southern lebanon, south of lebanon, the south]
      ar: [جنوب لبنان, الجنوب]

  mount-lebanon:
    label: Mount Lebanon
    children: [beit-chabab, chouf, deir-el-qamar, jabal-moussa, zouk-mikael]
    strong:
      en: [mount lebanon, mt lebanon, the mountain, keserwan, kesrouan]
      ar: [جبل لبنان, الجبل, كسروان]

  bekaa:
    label: Bekaa
    children: [bekaa-valley, baalbek, hermel, rachaya]
    strong:
      en: [bekaa, beqaa, bekaa valley, beqaa valley, the bekaa, bequaa]
      ar: [البقاع, بقاع, سهل البقاع]

# Price comparators. A number alone is never a constraint — §5.2 permits a bare number to be read
# as USD only inside an otherwise clear budget phrase, which is what these anchor.
price:
  max:
    en:
      [
        under,
        below,
        less than,
        lower than,
        up to,
        at most,
        no more than,
        not more than,
        cheaper than,
        max,
        maximum,
        within,
      ]
    ar:
      [
        تحت,
        أقل من,
        بأقل من,
        دون,
        بحد أقصى,
        أرخص من,
        لا يزيد عن,
        ما يزيد عن,
        حتى,
      ]
  min:
    en:
      [
        over,
        above,
        more than,
        greater than,
        at least,
        starting at,
        starting from,
        no less than,
        min,
        minimum,
      ]
    ar:
      [
        فوق,
        أكثر من,
        بأكثر من,
        على الأقل,
        بحد أدنى,
        أغلى من,
        لا يقل عن,
        ابتداء من,
      ]
  # {a} and {b} are the two bounds. Whitespace in a template is optional when matching, which is
  # what lets the Arabic conjunction attach directly to its number: "بين ١٠ و٢٥".
  range:
    - between {a} and {b}
    - from {a} to {b}
    - "{a} to {b}"
    - بين {a} و {b}
    - من {a} إلى {b}
    - من {a} حتى {b}

# §4 rules out currency conversion, and §5.2 forbids silently reading another currency as USD.
# Finding one of these beside a number suppresses that price inference outright: the number
# stays in the semantic text and no filter is applied.
foreign_currencies:
  en:
    [
      lbp,
      l.l.,
      ll,
      lira,
      liras,
      lire,
      lebanese pound,
      lebanese pounds,
      eur,
      euro,
      euros,
      gbp,
      pound,
      pounds,
      sterling,
      sar,
      riyal,
      aed,
      dirham,
      dirhams,
    ]
  ar: [ليرة, ليرات, ل.ل, يورو, جنيه, إسترليني, ريال, درهم]
  symbols: ["€", "£", "₤", "﷼"]

availability:
  strong:
    en: [in stock, in-stock, available now, currently available, on hand, available]
    ar: [متوفر, متوفرة, متاح, متاحة, موجود, بالمخزون, في المخزون, متوفر الآن]

sort:
  price_asc:
    en: [cheapest, cheap, lowest price, least expensive, price low to high, best value]
    ar: [الأرخص, أرخص, الأقل سعرا, الأوفر]
  price_desc:
    en: [most expensive, highest price, priciest, dearest, price high to low]
    ar: [الأغلى, أغلى, الأعلى سعرا]
  rating:
    en: [highest rated, best rated, top rated, best reviewed, highest rating]
    ar: [الأعلى تقييما, الأفضل تقييما, الأحسن تقييما, الأعلى تقييم]
  newest:
    en: [newest, latest, new arrivals, most recent, just arrived]
    ar: [الأحدث, أحدث, الجديد, وصل حديثا]
