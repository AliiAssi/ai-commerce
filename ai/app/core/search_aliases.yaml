

version: 1

# BEIT search lexicon — English and Arabic aliases for every deterministic filter.
#
# §6 requires this to be data rather than regular-expression literals scattered across the
# parser, and requires it to be versioned: `version` above is recorded on every parsed intent
# and in search analytics, so a ranking change is always attributable to a lexicon revision.
#
# Aliases are written in ordinary orthography. The loader folds them the same way it folds
# incoming queries (hamza seats, ya forms, ta marbuta, diacritics), so `أقل من` here matches
# `اقل من` typed by a shopper, and neither needs a variant entry. Arabic clitics are handled by
# the matcher, so `طرابلس` also matches `بطرابلس`.
#
# STRONG vs WEAK
# --------------
# A strong alias names the thing itself: "ceramics", "soap", "طرابلس". Matching one is enough
# to apply a filter.
#
# A weak alias is a word that names the category in some queries and a material or an object in
# others. "coffee" means the Coffee & Sweets category in `coffee from Beirut under 20`, but in
# `something for a Lebanese coffee ritual` it describes a use, and filtering to that category
# would hide the Copper Coffee Set — which §15.1 requires in the top five. So a weak alias
# applies its filter only when the rest of the query is short enough to be filter-like, per
# §5.2's rule that ambiguous words stay in the semantic text instead of becoming a hidden
# filter.
#
# Nothing here is stripped from the semantic text. Only price, stock and sort phrases are
# removed as constraint syntax; a category or origin word is descriptive and keeps earning its
# rank — §5.2.1 requires "from Beirut" to go on influencing order even once the Beirut filter
# itself has been dropped.

# Calibrated against §15, not picked round. At 2, `something for a Lebanese coffee ritual`
# reduces to two content tokens ("lebanese", "ritual") and would wrongly filter to Coffee &
# Sweets, hiding the Copper Coffee Set. At 1, that query stays semantic while `coffee from
# Beirut under 20` — one token past the alias — still filters.
weak_alias_max_extra_tokens: 1

categories:
  olive-oil:
