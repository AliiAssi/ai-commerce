version: 1

cases:

  - id: en-frying-oil-under-25
    query: olive oil for frying under $25
    language: en
    source: spec
    section: "15.1"
    expect_filters: {max_price: "25"}
    first: Everyday Cooking Olive Oil
    excluded: [Baladi Extra Virgin Olive Oil, Koura Valley First Press]
    note: >-
      The finishing and first-press oils are both over $25, so they must be filtered out rather
      than merely outranked. This is also why the parser keeps "olive oil" in the semantic text:
      stripping it would leave the ranker with "for frying".

  - id: en-coffee-ritual
    query: something for a Lebanese coffee ritual
    language: en
    source: spec
    section: "15.1"
    required: [Lebanese Coffee with Cardamom, Copper Coffee Set]
    top_k: 5
    note: >-
      Must NOT resolve a category filter. The Copper Coffee Set lives in Glass & Copper, so a
      coffee category filter would exclude the product this case requires — the reason `coffee`
      is a weak alias.

  - id: en-mezze-bowls
    query: green bowls for a mezze table
    language: en
    source: spec
    section: "15.1"
    first: Olive-Glaze Mezze Bowls, set of six

  - id: en-tripoli-soap
    query: traditional soap from Tripoli
    language: en
    source: spec
    section: "15.1"
    expect_filters: {origin_key: tripoli}
    required: [Tripoli Olive Oil Soap, "Laurel and Olive Soap, aged nine months"]
    top_k: 5
    exhaustive: true
    max_results: 2
    note: >-
      The catalog spells this origin two ways — "Tripoli" and "Tripoli, North Lebanon" — so the
      place hierarchy has to resolve both or one of the two soaps disappears. Tripoli is also
      where the baklava is made, so the origin filter alone cannot answer this: the relevance
      cutoff has to drop the one Tripoli product that is not a soap.

      The baklava is deliberately NOT listed under `excluded`. That assertion holds on every
      run, including the degraded module where no reranker exists to drop it — which would fail
      this case for the absence of a feature that module exists to measure the absence of.
      `exhaustive` says the same thing and is scored only where the cutoff is live.

  - id: en-housewarming-bcharre
    query: housewarming gift under $30 from Bcharre
    language: en
    source: spec
    section: "15.1"
    expect_filters: {max_price: "30", origin_key: bcharre}
    required:
      - "Cedar Coasters, set of six"
      - Mountain Wildflower Honey
      - Beeswax and Olive Candle
    top_k: 5

  - id: en-fattoush-in-stock
    query: available sour ingredient for fattoush
    language: en
    source: spec
    section: "15.1"
    expect_filters: {in_stock_only: true}
    first: Pomegranate Molasses
    exhaustive: true
    max_results: 4
    excluded: [Single-Origin Sumac]
    note: >-
      Sumac is the better semantic match and is sold out; availability must beat relevance —
      that exclusion holds on every run, because the stock filter needs no reranker.

      The 2026-08-01 smoke test saw ten products here: a basket, tumblers, a pitcher, a vase,
      soaps and napkins filled ranks 4-10. Trigram matched them weakly, the reranker sorted
      them to the bottom, and every one was still returned — ordering a tail is not removing
      it. Those products are deliberately NOT listed under `excluded`: that assertion is scored
      on every run, including the degraded module where nothing exists to drop them.
      `exhaustive` and `max_results` say the same thing where the cutoff is actually live.

  - id: en-glass-south-lebanon
    query: handmade recycled glass drinkware from south Lebanon
    language: en
    source: spec
    section: "15.1"
    expect_filters: {origin_key: south-lebanon}
    required: ["Sarafand Hand-Blown Tumblers, set of four", Recycled Glass Pitcher]
    top_k: 5

  - id: en-table-linens-under-30
    query: table linens under $30
    language: en
    source: spec
    section: "15.1"
    expect_filters: {max_price: "30"}
    required: ["Linen Napkins, set of four"]
    top_k: 5

  - id: en-nonsense
    query: zzzznotathing
    language: en
    source: spec
    section: "15.1"
    allow_empty: true
    note: >-
      §7.4's relevance floor. No filter is expressed, so the constraint fallback must not fire and
      the correct answer is nothing at all rather than the nearest neighbours.

  - id: en-exact-name
    query: Baladi Extra Virgin Olive Oil
    language: en
    source: spec
    section: "15.1"
    exact_name: true
    first: Baladi Extra Virgin Olive Oil

  - id: ar-frying-oil-under-25
    query: زيت زيتون للطبخ والقلي تحت ٢٥ دولار
    language: ar
    source: spec
    section: "15.2"
    expect_filters: {max_price: "25"}
    first: Everyday Cooking Olive Oil
    note: Arabic-Indic digits must normalize before the price phrase can be read at all.

  - id: ar-coffee-set
    query: عدة كاملة لتحضير القهوة اللبنانية
    language: ar
    source: spec
    section: "15.2"
