    section: "15.1"
    first: Striped Cotton Cushion
    note: Hard negative against Kilim Cushion Cover.

  - id: en-not-in-catalog
    query: espresso machine
    language: en
    source: spec
    section: "15"
    excluded: [Copper Coffee Set, Lebanese Coffee with Cardamom, Dark Roast Coffee Beans]
    note: >-
      The catalog has no appliances. Returning coffee products because they share a topic is
      the nearest-neighbour failure §7.4's floor exists to prevent.

      PROMOTED to spec in phase 6, deliberately and with the owner's agreement. It and its
      Arabic twin are the only evidence that the floor rejects a topically-related-but-absent
      product, which is the exact failure a vector leg introduces and which en-nonsense — random
      letters, similar to nothing — cannot detect. Both are hard negatives with `excluded` lists
      rather than judgements about ranking, so neither needs a native reading to be trustworthy.

