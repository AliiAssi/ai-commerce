    language: ar
    source: spec
    section: "15"
    excluded: [Copper Coffee Set, Hammered Copper Rakwe]
    note: >-
      There are no appliances. Returning the copper set because it is coffee-shaped is the
      nearest-neighbour failure the relevance floor exists to prevent — in Arabic this time.

      PROMOTED to spec in phase 6 alongside en-not-in-catalog; the reasoning is written out
      there. This one matters more, not less: Arabic has no lexical leg against an English
      catalog, so an Arabic query's candidates come from the semantic leg alone and there is no
      second opinion to keep an unrelated neighbour out.

