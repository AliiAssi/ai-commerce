      Reviewed 2026-07-31 and promoted. The phrasing is the idiomatic one, and both catalog soaps
      are olive oil soaps, so requiring both is the only defensible expectation. It replaces
      ar-soap-no-origin, which required one of the two arbitrarily and was deleted. Failing this
      case is how the two-strong-alias collision was found: صابون and زيت الزيتون both match
      strongly, and the longest-alias tie-break resolved the query to Olive Oil, a category
      neither soap is in.

