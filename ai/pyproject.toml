[project]
name = "ai-commerce-ai"
version = "0.1.0"
description = "ai-commerce AI service: shopping assistant + MCP server (FastAPI, DDD)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "mcp>=1.28,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.8",
    "asgi-lifespan>=2.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"app/application/search/*.py" = ["RUF001", "RUF002", "RUF003"]
"app/core/search_aliases.py" = ["RUF001", "RUF002", "RUF003"]
"app/infrastructure/repositories/search_repository.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_search_*.py" = ["RUF001", "RUF002", "RUF003"]
"tests/integration/test_search_*.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "app.core.container.Injected",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
