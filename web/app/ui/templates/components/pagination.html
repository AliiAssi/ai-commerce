{% if pages > 1 %}
{% set base_url = base_url | default("/catalog") %}
{% set target = target | default(none) %}
{% set sep = "&" if qs else "" %}
<nav class="flex items-center justify-center gap-4 pt-6 text-sm" aria-label="Pagination">
  {% if page > 1 %}
  <a href="{{ base_url }}?{{ qs }}{{ sep }}page={{ page - 1 }}"
     {% if target %}hx-get="{{ base_url }}?{{ qs }}{{ sep }}page={{ page - 1 }}" hx-target="{{ target }}" hx-swap="outerHTML show:window:top" hx-push-url="true"{% endif %}
     class="rounded-el border border-border bg-surface px-3 py-1.5 text-ink-muted hover:border-brand hover:text-brand">&larr; Prev</a>
  {% endif %}
  <span class="text-ink-muted">Page {{ page }} of {{ pages }}</span>
  {% if page < pages %}
  <a href="{{ base_url }}?{{ qs }}{{ sep }}page={{ page + 1 }}"
     {% if target %}hx-get="{{ base_url }}?{{ qs }}{{ sep }}page={{ page + 1 }}" hx-target="{{ target }}" hx-swap="outerHTML show:window:top" hx-push-url="true"{% endif %}
     class="rounded-el border border-border bg-surface px-3 py-1.5 text-ink-muted hover:border-brand hover:text-brand">Next &rarr;</a>
  {% endif %}
</nav>
{% endif %}
