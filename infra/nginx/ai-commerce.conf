server {
    listen 80;
    server_name ai-commerce.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ai-commerce.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/ai-commerce.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-commerce.duckdns.org/privkey.pem;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    if ($request_uri ~ "[^\x21-\x7e]") {
        return 400;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
