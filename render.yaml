envVarGroups:
  - name: ai-commerce-shared
    envVars:
      - key: INTERNAL_API_KEY
        generateValue: true

services:
  - type: web
    name: ai-commerce-web
    runtime: python
    plan: free
    rootDir: web
    # Migrations run at build, not at boot: a free instance boots on every cold start
    # and alembic adds seconds to each one.
    buildCommand: pip install uv && uv sync --frozen && uv run alembic upgrade head
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - fromGroup: ai-commerce-shared
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        sync: false
      # Whether to delegate catalog search to the AI service. Enable that side first, then
      # this one — reversed, every query crosses the network only to come back lexical.
      - key: SMART_SEARCH_ROUTING_ENABLED
        value: "false"
      - key: SEARCH_TIMEOUT_SECONDS
        value: "3.0"

  - type: web
    name: ai-commerce-ai
    runtime: python
    plan: free
    rootDir: ai
    buildCommand: pip install uv && uv sync --frozen && uv run alembic upgrade head
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - fromGroup: ai-commerce-shared
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: ollama
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_MODEL
        value: gemma4:31b-cloud
      - key: MCP_BEARER_TOKEN
        sync: false
      - key: LLM_TIMEOUT_SECONDS
        value: "60"
      # This service owns retrieval, so the search models are configured here beside the chat
      # model. The embedding model has been benchmarked and fixed; this stays off until vector
      # retrieval exists to use it, and is then enabled after web's routing flag, never before
      # (§19) — the reverse order sends every query across the network only to come back lexical.
      - key: SMART_SEARCH_ENABLED
        value: "false"
      # Provider, host and model are configuration, not secrets, and all three have to match
      # what the stored vectors were built with — so they are pinned here rather than left to
      # drift in a dashboard. Only the key is dashboard-managed.
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: EMBEDDING_HOST
        value: https://generativelanguage.googleapis.com
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      # Pinned, not dashboard-managed: this must match the vector(n) column and HNSW index
      # exactly. A dashboard value drifting from the migration would not fail at boot — it
      # would fail on the first write, after the backfill had already been paid for.
      # Chosen by bake-off 2026-07-29; changing it requires re-embedding the whole catalog.
      - key: EMBEDDING_DIMENSIONS
        value: "768"
      - key: RERANKER_PROVIDER
        sync: false
      - key: RERANKER_HOST
        sync: false
      - key: RERANKER_API_KEY
        sync: false
      - key: RERANKER_MODEL
        sync: false
      # The index worker runs inside this process (§11), so indexing needs no second service
      # and no scheduler. It fills the search documents on boot and keeps them current from
      # then on, which is why the build command migrates but does not backfill. Turn this off
      # only if the index is being maintained by `reindex_catalog` from somewhere else.
      - key: SEARCH_INDEX_WORKER_ENABLED
        value: "true"
