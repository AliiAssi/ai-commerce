envVarGroups:
  - name: ai-commerce-shared
    envVars:
      - key: INTERNAL_API_KEY
        generateValue: true

services:
  - type: web
    name: ai-commerce-web
    runtime: python
    plan: free
    rootDir: web
    # Migrations run at build, not at boot: a free instance boots on every cold start
    # and alembic adds seconds to each one.
    buildCommand: pip install uv && uv sync --frozen && uv run alembic upgrade head
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - fromGroup: ai-commerce-shared
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        sync: false
      # Whether to delegate catalog search to the AI service. Enable that side first, then
      # this one — reversed, every query crosses the network only to come back lexical.
      - key: SMART_SEARCH_ROUTING_ENABLED
        value: "false"
      - key: SEARCH_TIMEOUT_SECONDS
        value: "3.0"

  - type: web
    name: ai-commerce-ai
    runtime: python
    plan: free
    rootDir: ai
    buildCommand: pip install uv && uv sync --frozen && uv run alembic upgrade head
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - fromGroup: ai-commerce-shared
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: ollama
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_MODEL
        value: gemma4:31b-cloud
      - key: MCP_BEARER_TOKEN
        sync: false
      - key: LLM_TIMEOUT_SECONDS
        value: "60"
      # This service owns retrieval, so the search models are configured here beside the chat
      # model. Off in production until benchmarked; credentials are dashboard-managed.
      - key: SMART_SEARCH_ENABLED
        value: "false"
      - key: EMBEDDING_PROVIDER
        sync: false
      - key: EMBEDDING_HOST
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        sync: false
      - key: EMBEDDING_DIMENSIONS
        sync: false
      - key: RERANKER_PROVIDER
        sync: false
      - key: RERANKER_HOST
        sync: false
      - key: RERANKER_API_KEY
        sync: false
      - key: RERANKER_MODEL
        sync: false
      # The index worker runs inside this process (§11), so indexing needs no second service
      # and no scheduler. It fills the search documents on boot and keeps them current from
      # then on, which is why the build command migrates but does not backfill. Turn this off
      # only if the index is being maintained by `reindex_catalog` from somewhere else.
      - key: SEARCH_INDEX_WORKER_ENABLED
        value: "true"
