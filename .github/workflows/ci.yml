name: CI

on:
  push:
  pull_request:

# Every job's Postgres is pgvector/pgvector:pg18, not stock postgres: the migrations create
# the `vector` and `pg_trgm` extensions and stock images do not ship vector. pg18 also matches
# production, which is Neon PostgreSQL 18.x.
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_commerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      # Catches migrations and ORM models drifting apart — an index added in one but not the
      # other looks fine until autogenerate silently proposes dropping it.
      - name: Schema drift
        run: uv run alembic upgrade head && uv run alembic check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_commerce_test
      - name: Tests (unit + integration)
        run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_commerce_test

  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_commerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --frozen
      - name: Install web dependencies (for store migrations)
        working-directory: web
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      # This service's search tables carry foreign keys into the store catalog, so web's
      # migrations must land first. Running them in this order here is also what proves the
      # ordering requirement holds.
      - name: Schema drift
        run: |
          (cd ../web && uv run alembic upgrade head)
          uv run alembic upgrade head
          uv run alembic check
        env:
          # DATABASE_URL and nothing else, deliberately. Migrations build DatabaseSettings
          # rather than the full Settings, so a new application secret can never break them.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_commerce_test
      - name: Tests (unit + integration)
        run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_commerce_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_commerce_build
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_commerce_build
      JWT_SECRET: ci-build-secret-0123456789abcdef
      API_BASE_URL: http://127.0.0.1:8000
      # The AI service owns retrieval, so the storefront's search cannot be exercised without
      # it. Routing is enabled here so the end-to-end suite proves the whole chain — browser,
      # Next, web, ai, database — rather than only web's lexical fallback.
      AI_SERVICE_URL: http://127.0.0.1:8001
      SMART_SEARCH_ROUTING_ENABLED: "true"
      INTERNAL_API_KEY: ci-internal-key-0123456789
      MCP_BEARER_TOKEN: ci-mcp-token-0123456789
      OLLAMA_API_KEY: ci-unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint && npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test

      # everything below exists so `next build` has a catalog to prerender, and so the
      # end-to-end suite has a real store to drive
      - uses: astral-sh/setup-uv@v6
      - name: Install web dependencies
        working-directory: web
        run: uv sync --frozen
      - name: Install AI dependencies
        working-directory: ai
        run: uv sync --frozen
      - name: Migrate and seed the store
        working-directory: web
        run: |
          uv run alembic upgrade head
          uv run python -m app.application.jobs.seed_catalog
      # ai's search tables carry foreign keys into the catalog, so web migrates first.
      # §11 makes the backfill part of the seed workflow: without it the E2E suite starts
      # querying before the worker's first sweep and every search answers from §12's step 4,
      # leaving the document leg unexercised in the one place the whole chain is proven.
      - name: Migrate the AI schema and backfill the search index
        working-directory: ai
        run: |
          uv run alembic upgrade head
          uv run python -m app.application.jobs.reindex_catalog --all
      - name: Start the API
        working-directory: web
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/healthz && exit 0
            sleep 1
          done
          echo "API did not come up" >&2
          exit 1
      - name: Start the AI service
        working-directory: ai
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8001 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8001/healthz && exit 0
            sleep 1
          done
          echo "AI service did not come up" >&2
          exit 1
      - name: Build
        run: npm run build

      # The suite drives a browser against the built app. It catches the class of bug that
      # only appears once Next navigates on the client instead of reloading the document —
      # which unit tests structurally cannot see.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
