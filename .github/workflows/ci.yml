name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_commerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests (unit + integration)
        run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_commerce_test

  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_commerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --frozen
      - name: Install web dependencies (for store migrations)
        working-directory: web
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests (unit + integration)
        run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_commerce_test

  # Lint/typecheck/tests need nothing but node — the tests stub fetch. `next build` is
  # different: it prerenders /, the static pages and every product page, so it needs a real
  # API to fetch from. That is the point of running it here rather than trusting Vercel:
  # a broken prerender fails the PR, not the deploy.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_commerce_build
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_commerce_build
      JWT_SECRET: ci-build-secret-0123456789abcdef
      API_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint && npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test

      # everything below only exists so `next build` has a catalog to prerender
      - uses: astral-sh/setup-uv@v6
      - name: Install web dependencies
        working-directory: web
        run: uv sync --frozen
      - name: Migrate and seed the store
        working-directory: web
        run: |
          uv run alembic upgrade head
          uv run python -m app.application.jobs.seed_catalog
      - name: Start the API
        working-directory: web
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/healthz && exit 0
            sleep 1
          done
          echo "API did not come up" >&2
          exit 1
      - name: Build
        run: npm run build
