name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vm
  cancel-in-progress: false

permissions:
  contents: read
  statuses: read

jobs:
  vm:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: infra/deploy

      # next build prerenders against the live API, so the VM must not restart mid-build
      - name: Wait for the Vercel production build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 60); do
            state=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/commits/$SHA/status" \
              | jq -r '[.statuses[] | select(.context == "Vercel")][0].state // "missing"')
            echo "Vercel: $state"
            case "$state" in
              success) exit 0 ;;
              failure | error) echo "::error::Vercel build failed, so the VM is left as it is"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::Vercel build did not finish within 20 minutes"
          exit 1

      - name: Deploy to the VM
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=infra/deploy/known_hosts \
            username@ai-commerce.duckdns.org "$SHA"
